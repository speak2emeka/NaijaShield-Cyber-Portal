<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="darkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#006B3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004d2b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brightGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D97F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF99;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer shield border -->
  <path d="M 100 15 L 165 45 L 165 105 C 165 150 100 185 100 185 C 100 185 35 150 35 105 L 35 45 Z" 
        fill="none" stroke="#006B3C" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Left side - Circuit pattern (dark green) -->
  <path d="M 100 15 L 165 45 L 165 105 C 165 150 100 185 100 185 Z" 
        fill="url(#darkGreen)" opacity="0.95"/>
  
  <!-- Right side - Bright green accent -->
  <path d="M 100 30 L 155 60 L 155 105 C 155 145 100 175 100 185 C 100 175 135 145 135 105 L 135 50 Z" 
        fill="url(#brightGreen)" opacity="0.85"/>
  
  <!-- Center white stripe -->
  <rect x="96" y="25" width="8" height="160" fill="white" opacity="0.95"/>
  
  <!-- Circuit lines (left side) - WHITE -->
  <g stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Line 1 -->
    <path d="M 55 55 L 70 55 L 70 60"/>
    <circle cx="75" cy="60" r="2.5" fill="white"/>
    <path d="M 80 60 L 90 60"/>
    
    <!-- Line 2 -->
    <path d="M 52 80 L 70 80 L 70 85"/>
    <circle cx="75" cy="85" r="2.5" fill="white"/>
    <path d="M 80 85 L 92 85"/>
    
    <!-- Line 3 -->
    <path d="M 56 105 L 70 105 L 70 110"/>
    <circle cx="75" cy="110" r="2.5" fill="white"/>
    <path d="M 80 110 L 90 110"/>
    
    <!-- Line 4 -->
    <path d="M 54 130 L 70 130 L 70 135"/>
    <circle cx="75" cy="135" r="2.5" fill="white"/>
    <path d="M 80 135 L 88 135"/>
    
    <!-- Curved bottom -->
    <path d="M 58 150 L 72 150 L 72 155"/>
  </g>
  
  <!-- Keyhole (center) - DARK NAVY -->
  <g fill="#001a33">
    <!-- Upper circle -->
    <circle cx="100" cy="80" r="6"/>
    <!-- Lower shaft -->
    <rect x="97" y="87" width="6" height="25" rx="3"/>
  </g>
</svg>
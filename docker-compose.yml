services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: naijashield
      POSTGRES_PASSWORD: naijashield
      POSTGRES_DB: naijashield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naijashield -d naijashield"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      API_BASE_URL: http://localhost:5000
      FRONTEND_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://naijashield:naijashield@postgres:5432/naijashield?schema=public
      JWT_ACCESS_SECRET: replace-with-a-long-random-access-secret-32chars
      JWT_REFRESH_SECRET: replace-with-a-long-random-refresh-secret-32chars
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 14
      COOKIE_DOMAIN: localhost
      COOKIE_SECURE: "false"
      UPLOAD_DIR: uploads/reports
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    volumes:
      - report_uploads:/app/uploads/reports
    command: sh -c "npx prisma migrate deploy && node dist/src/server.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.3.0
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  report_uploads:
